version: '3.8'
services:
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports: ["8761:8761"]
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on: [discovery-server]
    ports: ["8080:8080"]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - ./infra/mysql-init:/docker-entrypoint-initdb.d
  redis:
    image: redis:7
    ports: ["6379:6379"]
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-kafka:7.3.2
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on: [mysql, kafka, discovery-server]
    ports: ["8081:8081"]
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    depends_on: [mysql, discovery-server]
    ports: ["8082:8082"]
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    depends_on: [mysql, kafka, discovery-server]
    ports: ["8083:8083"]
  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    depends_on: [redis, discovery-server]
    ports: ["8084:8084"]
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    depends_on: [mysql, kafka, discovery-server, inventory-service, payment-service]
    ports: ["8085:8085"]
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    depends_on: [mysql, kafka, discovery-server]
    ports: ["8086:8086"]
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on: [kafka, discovery-server]
    ports: ["8087:8087"]
